[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[redirects]]
  from = "https://www.costaco.life/*"
  to = "https://costaco.life/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/zonas/*"
  to = "/propiedades/"
  status = 301
